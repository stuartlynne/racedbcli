[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racedbcli"
version = "0.1.0"
description = "CLI tools for interacting with RaceDB"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
readme = "racedbcli/README.md"
license = { text = "MIT" }
dependencies = [
    "requests",
    "openpyxl",
    "pandas",
    "click"
]
requires-python = ">=3.7"

[project.scripts]
racedbcli = "racedbcli.cli.__init__:main"

[tool.setuptools]
packages = ["racedbcli", "racedbcli.cli", "racedbcli.libs"]

[tool.setuptools.package-data]
racedbcli.cli = ["members.xlsx"]
